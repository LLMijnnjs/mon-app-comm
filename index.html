<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 LED Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💡</h1>
        <h2>LED Test</h2>
        <p class="subtitle">Contrôle la LED de loin</p>
        
        <div id="status" class="status off">🔴 Déconnecté</div>
        
        <div class="buttons">
            <button class="btn-on" onclick="sendLED('on')">💡 ALLUMER</button>
            <button class="btn-off" onclick="sendLED('off')">⚫ ÉTEINDRE</button>
        </div>
        
        <div class="log" id="log"></div>
        
        <div class="config">
            <label for="serverUrl">URL du serveur (Replit):</label>
            <input type="text" id="serverUrl" placeholder="https://server-esp32-xog3-production.up.railway.app/">
            <button onclick="changeServer()" style="width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">Changer</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
