<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 LED Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
      /* Petit style d'accessibilité pour le formulaire de message */
      .message-form { display:flex; gap:0.5rem; margin:1rem 0; }
      .message-form input[type="text"] { flex:1; padding:0.5rem; }
      .visually-hidden { position: absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap; }
    </style>
</head>
<body>
    <!-- Auth overlay (visible au chargement) -->
    <div id="auth" class="auth-overlay">
      <div class="auth-box">
        <h2>Authentification</h2>

        <label for="authId">ID</label>
        <select id="authId">
          <option value="PHONE1">PHONE1</option>
          <option value="PHONE2">PHONE2</option>
        </select>

        <label for="authPassword">Mot de passe</label>
        <input id="authPassword" type="password" autocomplete="off" />

        <div class="auth-actions">
          <button id="authCancel" type="button">Quitter</button>
          <button id="authSubmit" type="button">Se connecter</button>
        </div>

        <p id="authError" class="error" aria-live="polite" style="display:none"></p>
      </div>
    </div>

    <!-- Main app (cachée jusqu'à auth ok) -->
    <main id="app" style="display:none">
      <div class="container">
          <h1>💡</h1>
          <h2>LED Test</h2>
          <p class="subtitle">Contrôle la LED de loin</p>

          <div id="status" class="status off">🔴 Déconnecté</div>

          <div class="buttons">
              <button class="btn-on" onclick="sendLED('on')">💡 ALLUMER</button>
              <button class="btn-off" onclick="sendLED('off')">⚫ ÉTEINDRE</button>
          </div>

          <!-- Message input: permet d'envoyer un message texte au serveur.
               Le formulaire capte Entrée (submit) et déclenche l'envoi via script.js. -->
          <form id="messageForm" class="message-form" onsubmit="event.preventDefault(); document.getElementById('messageSend')?.click();">
            <label for="messageInput" class="visually-hidden">Message</label>
            <input type="text" id="messageInput" placeholder="Votre message..." autocomplete="off" aria-label="Votre message">
            <button type="submit" id="messageSend">Envoyer</button>
          </form>

          <div class="log" id="log" aria-live="polite"></div>

          <div class="config">
              <label for="serverUrl">URL du serveur (Railway):</label>
              <input type="text" id="serverUrl" placeholder="https://server-esp32-xog3-production.up.railway.app/">
              <button onclick="changeServer()" class="btn-change">Changer</button>
          </div>
      </div>
    </main>

    <!-- client log forwarder (captures console.* and posts to /client-logs) -->
    <script src="/script-client-logs.js"></script>
    <script src="script.js"></script>
</body>

</html>
